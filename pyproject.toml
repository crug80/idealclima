[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idealclima"
version = "0.1.0"
description = "Async Modbus library for Idealclima fan coil units (Comfosplit IKARO HW and Radiantore SKUDO DC Inverter)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Claudio" },
]
keywords = ["idealclima", "modbus", "home-assistant", "ikaro", "skudo", "hvac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "modbus-connection>=4.12.7",
]

[project.optional-dependencies]
tmodbus = [
    "modbus-connection[tmodbus]>=4.12.7",
]

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idealclima"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["idealclima"]
mypy_path = "src"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
]
